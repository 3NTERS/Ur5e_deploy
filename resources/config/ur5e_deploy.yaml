format_version: 1

policy:
  # Export the matching Ur5eRobotiq checkpoint to this path before deployment.
  model: resources/models/ur5e_robotiq/policy.onnx
  metadata: resources/models/ur5e_robotiq/policy.meta.yaml
  provider: cuda
  period: 0.01667
  episode_steps: 600

robot:
  # Dedicated Ethernet link to the UR control box. The PC is expected at 192.168.1.20/24.
  host: 192.168.1.10
  # Robotiq Grippers URCap socket exposed by the control box. The external RS-485 cable
  # terminates at the control box; the deployment PC does not open a serial device.
  gripper_port: 63352
  home_joint_position: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  home_speed: 0.25
  home_acceleration: 0.5
  home_tolerance: 0.02
  servo_speed: 0.5
  servo_acceleration: 1.0
  servo_period: 0.002
  servo_lookahead: 0.1
  servo_gain: 300
  # FIFO priorities: RTDE receive > RTDE control > Python servo target feeder.
  rtde_receive_priority: 90
  rtde_control_priority: 85
  servo_thread_priority: 80
  gripper_speed: 255
  gripper_force: 100

camera:
  # The connected device name must contain this value (case-insensitive).
  model: D435i
  serial: null
  width: 640
  height: 480
  fps: 60
  # Eye-on-hand: the RealSense is rigidly attached to the currently configured UR TCP.
  calibration: resources/calibration/eye_on_hand.yaml
  max_detection_sync_interval_s: 0.25
  max_detection_translation_delta_m: 0.002
  max_detection_rotation_delta_deg: 0.5
  max_detection_linear_speed_m_s: 0.005
  max_detection_angular_speed_rad_s: 0.02

tracking_camera:
  # Fixed eye-on-base D435i. Both camera serial numbers must be filled and different.
  model: D435i
  serial: null
  width: 640
  height: 480
  fps: 60
  calibration: resources/calibration/eye_on_base.yaml

tracking:
  cross_camera_max_delta_m: 0.05
  association_max_distance_m: 0.25
  position_alpha: 0.6
  velocity_alpha: 0.4
  prediction_horizon_s: 0.10
  max_state_age_s: 0.15

vision:
  weights: resources/models/vision/object_yolo.pt
  # Multi-class weights are supported. Only this class is passed to the RL policy.
  target_class: object
  confidence: 0.5
  depth_radius: 3
  depth_min: 0.05
  depth_max: 3.0
  center_depth_offset_m: 0.01
  detection_attempts: 30
  device: null

task:
  # Bucket/goal centre in the UR base frame. Measure this for the real cell.
  goal_position: [0.80, 0.35, 0.05]
  # Vision updates position/linear velocity; orientation stays fixed and angular velocity is zero.
  object_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  # Must match the object variant used by the exported policy.
  object_scale: [1.0, 1.0, 1.0]
  palm_center_offset: [0.0, 0.0, 0.145]

# Applied only when policy metadata declares deployment_class: smoke_only.
# These values never relax the production profile above or the safety workspace below.
smoke_policy:
  arm_action_scale: 0.05
  max_arm_step: 0.008
  max_joint_velocity: 0.5
  max_target_error: 0.06
  gripper_speed: 32
  gripper_force: 20
  goal_offset_m: [0.0, 0.0, 0.12]

safety:
  # Both this flag and CLI --execute are required before commands can be sent.
  allow_motion: false
  arm_lower: [-3.14159, -3.14159, -2.82743, -3.14159, -3.14159, -3.14159]
  arm_upper: [3.14159, 0.0, 2.82743, 0.0, 3.14159, 3.14159]
  max_arm_step: 0.05
  max_joint_velocity: 2.0
  max_target_error: 0.20
  max_state_age: 0.25
  max_policy_lag: 0.05
  workspace_min: [0.15, -0.80, 0.02]
  workspace_max: [1.00, 0.80, 1.20]
  object_position_min: [0.20, -0.60, 0.02]
  object_position_max: [0.90, 0.60, 0.80]

output:
  directory: resources/trajectories/ur5e_real

calibration:
  type: eye_on_hand
  method: park
  samples: 20
  minimum_inliers: 12
  session_directory: resources/calibration/sessions
  checkerboard:
    model: DFVision Q12-240-15
    # This target has 12x9 printed squares, hence 11x8 OpenCV inner corners.
    columns: 11
    rows: 8
    square_size_m: 0.015
    pattern_size_m: [0.180, 0.135]
    overall_size_m: [0.240, 0.200]
  max_reprojection_error_px: 1.0
  max_capture_interval_s: 0.25
  max_capture_translation_delta_m: 0.002
  max_capture_rotation_delta_deg: 0.5
  max_tcp_linear_speed_m_s: 0.005
  max_tcp_angular_speed_rad_s: 0.02
  minimum_sample_translation_m: 0.020
  minimum_sample_rotation_deg: 8.0
  minimum_translation_span_m: 0.10
  minimum_rotation_span_deg: 30.0
  max_board_translation_error_m: 0.010
  max_board_rotation_error_deg: 2.0

eye_on_base_calibration:
  type: eye_on_base
  method: shah
  samples: 20
  minimum_inliers: 12
  session_directory: resources/calibration/eye_on_base_sessions
  max_reprojection_error_px: 1.0
  max_capture_interval_s: 0.25
  max_capture_translation_delta_m: 0.002
  max_capture_rotation_delta_deg: 0.5
  max_tcp_linear_speed_m_s: 0.005
  max_tcp_angular_speed_rad_s: 0.02
  minimum_sample_translation_m: 0.020
  minimum_sample_rotation_deg: 8.0
  minimum_translation_span_m: 0.10
  minimum_rotation_span_deg: 30.0
  max_board_translation_error_m: 0.010
  max_board_rotation_error_deg: 2.0
