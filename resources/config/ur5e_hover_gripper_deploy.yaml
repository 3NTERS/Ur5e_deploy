format_version: 1

policy:
  model: resources/models/ur5e_hover_gripper/policy.onnx
  metadata: resources/models/ur5e_hover_gripper/policy.meta.yaml
  sha256: 1fab8538f3dcf4ef78e0dd2a6d2794e6310a4f888bf33a545e440d1c9235e7b6
  provider: cpu
  period: 0.01667
  episode_steps: 300

robot:
  host: 192.168.1.10
  gripper_port: 63352
  # Hover policy and the corrected MuJoCo model use the real-controller signs.
  initial_joint_position: [-1.5707963, -1.5707963, -1.5707963, -1.5707963, 1.5707963, 0.0]
  servo_speed: 0.40
  servo_acceleration: 0.80
  servo_period: 0.002
  servo_lookahead: 0.10
  servo_gain: 300
  rtde_receive_priority: 90
  rtde_control_priority: 85
  servo_thread_priority: 80
  gripper_speed: 32
  gripper_force: 20
  prepare_gripper_open: true
  gripper_open_timeout_s: 10.0

observation:
  # This is the hover-specific model whose zero pose was aligned with the robot.
  model: resources/assets/robots/ur5e_robotiq_2f85/ur5e_hover_gripper.xml
  model_sha256: 1167bcd0e4b504fb6c66e3226c86773dcaf8b87c70aefbbb8b76dc246fdd5265
  # Matches the robotiq_pinch site used by the validated MuJoCo adapter.
  palm_center_offset: [0.001338, 0.031862, 0.118393] #[0.0, 0.0, 0.145]
  object_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  object_scale: [1.0, 1.0, 1.0]

camera:
  enabled: true
  model: D435i
  serial: 254522076163
  width: 640
  height: 480
  fps: 60
  calibration: resources/calibration/eye_on_hand.yaml
  require_calibration: true
  initial_lock_timeout_s: 15.0
  max_frame_age_s: 0.50
  # Maximum difference between a camera frame and the nearest buffered RTDE pose.
  max_pose_sync_error_s: 0.05

vision:
  enabled: true
  weights: resources/models/vision/object_yolo.pt
  target_class: object
  confidence: 0.50
  depth_radius: 3
  depth_min: 0.05
  depth_max: 3.0
  # The RGB-D point must represent the simulated object centre, not its top surface.
  center_depth_offset_m: 0.01
  device: null
  # YOLO runs asynchronously; the 60 Hz policy consumes filtered/predicted state.
  inference_interval_s: 0.20
  visualization:
    enabled: true
    window_name: UR5e hover wrist-camera diagnostics
    refresh_interval_s: 0.05

tracking:
  initial_measurements: 5
  initial_max_position_spread_m: 0.03
  initial_max_speed_m_s: 0.10
  association_max_distance_m: 0.15
  position_alpha: 0.60
  velocity_alpha: 0.40
  prediction_horizon_s: 0.10
  max_state_age_s: 0.50
  max_object_speed_m_s: 0.30

safety:
  # Real motion requires both this flag and the CLI --execute flag.
  allow_motion: true
  initial_joint_tolerance: 0.05
  initial_gripper_open_max: 5
  # Provisional joint corridor from 30 randomized 300-step MuJoCo rollouts.
  # The model recorded no robot contacts, but that is not a physical-cell
  # collision guarantee. Keep motion disabled pending supervised review.
  # Simulated q min [-1.6924, -1.9634, -2.3260, -1.5868, 0.9265, -0.2136],
  # max [-1.0759, -1.4983, -1.5705, -1.0126, 1.6545, 0.1928] rad.
  arm_lower: [-1.9208, -2.02, -2.40, -1.9208, 0.85, -0.35]
  arm_upper: [-1.00, -1.0208, -1.0208, -0.95, 1.9208, 0.35]
  max_joint_velocity: 0.60
  max_arm_step: 0.01
  max_target_error: 0.12
  max_target_error_cycles: 3
  max_state_age_s: 0.25
  max_policy_lag_s: 0.05
  max_cycle_duration_s: 0.10
  # Observed palm min [-0.2477, -0.5758, 0.1098] m,
  # max [0.0287, -0.3795, 0.3698] m; margins are 0.03-0.05 m.
  workspace_min: [-0.28, -0.77, 0.08]
  workspace_max: [0.18, -0.35, 0.40]
  # Isaac hover reset: [-0.10214, -0.49067] +/- 0.12 m in XY,
  # plus approximately 1 cm allowance for camera measurements.
  object_position_min: [-0.23, -0.77, 0.02]
  object_position_max: [0.18, -0.36, 0.50]
  hover_height_m: 0.12
  success_radius_m: 0.08
  max_object_displacement_m: 0.015
  consecutive_success_steps: 30

return_to_initial:
  # Offered only after a complete, error-free executed episode. The operator
  # must type RETURN; aborted episodes require supervised manual recovery.
  enabled: true
  joint_speed: 0.10
  joint_acceleration: 0.20
  position_tolerance: 0.03
  max_start_joint_velocity: 0.05
  settle_timeout_s: 3.0
  max_joint_distance: 0.85
  path_samples: 101

calibration:
  checkerboard:
    model: DFVision Q12-240-15
    columns: 11
    rows: 8
    square_size_m: 0.015
    pattern_size_m: [0.180, 0.135]
    overall_size_m: [0.240, 0.200]

output:
  directory: resources/trajectories/ur5e_hover_gripper_real
  save_object_csv: true
  print_object_state: true
  print_observation_69: false
